name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed to all manifests (for example 0.2.0-beta.1)
        required: true
        type: string
      mode:
        description: Safe test only, publish prerelease, or publish stable
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - prerelease
          - stable

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ inputs.version }}
  RUST_VERSION: 1.94.1

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release must be run from the main branch, not $GITHUB_REF." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Validate synchronized version
        run: node scripts/release-version.mjs check "$RELEASE_VERSION"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests and checks
        run: |
          npm run test:unit
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=high

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      - name: Run Rust tests and checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test glib safety backport with optimizations
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml -p glib-variant-regression

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock

  sbom:
    name: Generate SPDX SBOM
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate SPDX 2.3 JSON
        env:
          SYFT_COMMAND: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir release-sbom
          "$SYFT_COMMAND" scan dir:. \
            --exclude './node_modules/**' \
            --exclude './src-tauri/target/**' \
            --source-name tz-chatter \
            --source-version "$RELEASE_VERSION" \
            --output "spdx-json=release-sbom/tz-chatter-v${RELEASE_VERSION}.sbom.spdx.json"

      - name: Attest SBOM provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-sbom/tz-chatter-v${{ inputs.version }}.sbom.spdx.json

      - name: Upload SBOM for release jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: release-sbom/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows x64 installer
    needs: [validate, sbom]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Name release asset
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($packages.Count -ne 1) {
            throw "Expected one NSIS installer, found $($packages.Count)."
          }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item -LiteralPath $packages[0].FullName -Destination "release-assets/tz-chatter-v$env:RELEASE_VERSION-windows-x64-setup.exe"

      - name: Download SPDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: release-sbom

      - name: Attest Windows build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/tz-chatter-v${{ inputs.version }}-windows-x64-setup.exe

      - name: Attach SPDX SBOM attestation to Windows installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/tz-chatter-v${{ inputs.version }}-windows-x64-setup.exe
          sbom-path: release-sbom/tz-chatter-v${{ inputs.version }}.sbom.spdx.json

      - name: Upload Windows installer for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux x86_64 AppImage
    needs: [validate, sbom]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage

      - name: Name release asset
        run: |
          mapfile -t packages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage')
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected one AppImage, found ${#packages[@]}." >&2
            exit 1
          fi
          mkdir release-assets
          cp "${packages[0]}" "release-assets/tz-chatter-v${RELEASE_VERSION}-linux-x86_64.AppImage"

      - name: Download SPDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: release-sbom

      - name: Attest Linux build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/tz-chatter-v${{ inputs.version }}-linux-x86_64.AppImage

      - name: Attach SPDX SBOM attestation to Linux AppImage
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/tz-chatter-v${{ inputs.version }}-linux-x86_64.AppImage
          sbom-path: release-sbom/tz-chatter-v${{ inputs.version }}.sbom.spdx.json

      - name: Upload Linux AppImage for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release candidate
    needs: [windows, linux, sbom]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify expected assets
        run: |
          expected=(
            "release-assets/tz-chatter-v${RELEASE_VERSION}-windows-x64-setup.exe"
            "release-assets/tz-chatter-v${RELEASE_VERSION}-linux-x86_64.AppImage"
            "release-assets/tz-chatter-v${RELEASE_VERSION}.sbom.spdx.json"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * | sort --key=2 > SHA256SUMS

      - name: Attest checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/SHA256SUMS

      - name: Upload complete release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-complete
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable GitHub release
    if: inputs.mode != 'dry-run'
    needs: assemble
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download complete release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-complete
          path: release-assets

      - name: Require immutable releases and unused version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ inputs.version }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" --silent; then
            echo "Enable Settings -> General -> Releases -> Immutable releases before publishing." >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists." >&2
            exit 1
          fi

      - name: Write release notice
        run: |
          cat > release-notes.md <<'EOF'
          ## Important trust information

          These packages are intentionally **not Authenticode-signed**. Windows may display a SmartScreen warning. Download tz-chatter only from this GitHub release and verify its provenance before running it.

          The release includes SHA-256 checksums and an SPDX 2.3 JSON software bill of materials. Each executable package has GitHub/Sigstore build-provenance and SBOM attestations tied to this repository, workflow, and commit.

          Verify a downloaded package with:

          ```text
          gh attestation verify PATH_TO_DOWNLOADED_FILE --repo taggedzi/tz-chatter
          ```

          See `VERIFYING.md` in the source repository for checksum and SBOM-attestation commands. tz-chatter requires a separately installed and running local model provider such as Ollama or LM Studio.
          EOF

      - name: Create draft with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ inputs.version }}
        run: |
          release_notice=$(cat release-notes.md)
          gh release create "$TAG_NAME" release-assets/* \
            --draft \
            --generate-notes \
            --notes "$release_notice" \
            --target "$GITHUB_SHA" \
            --title "tz-chatter $TAG_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          TAG_NAME: v${{ inputs.version }}
        run: |
          options=(--draft=false)
          if [[ "$RELEASE_MODE" == "prerelease" ]]; then
            options+=(--prerelease)
          else
            options+=(--latest)
          fi
          gh release edit "$TAG_NAME" "${options[@]}"
